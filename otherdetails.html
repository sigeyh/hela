<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Details | Hela Pesa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-mesh min-h-screen text-white font-sans py-12 px-6">

  <div id="loader" class="hidden fixed inset-0 z-[100] bg-[#0f172a]/90 backdrop-blur-md flex flex-col items-center justify-center">
    <div class="relative w-20 h-20 mb-6">
      <div class="absolute inset-0 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
    </div>
    <div class="text-xl font-bold text-white uppercase animate-pulse">Calculating Eligibility...</div>
  </div>

  <div class="max-w-xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-10">
      <img src="zashlogo.png" alt="Hela Pesa" class="w-16 h-16 mx-auto mb-4 rounded-full shadow-2xl border-2 border-red-600/30">
      <h1 class="text-3xl font-extrabold mb-2 uppercase tracking-tight">Financial information</h1>
      <p class="text-slate-400">Step 2 of 3: Verification & Assessment</p>
    </div>

    <!-- Form Container -->
    <div class="glass-card p-8 lg:p-12">
      <div class="space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">County Resident</label>
            <select id="county" class="premium-input">
              <option disabled selected>Select County</option>
              <option>Baringo</option><option>Bomet</option><option>Bungoma</option><option>Busia</option><option>Elgeyo-Marakwet</option><option>Embu</option><option>Garissa</option><option>Homa Bay</option><option>Isiolo</option><option>Kajiado</option><option>Kakamega</option><option>Kericho</option><option>Kiambu</option><option>Kilifi</option><option>Kirinyaga</option><option>Kisii</option><option>Kisumu</option><option>Kitui</option><option>Kwale</option><option>Laikipia</option><option>Lamu</option><option>Machakos</option><option>Makueni</option><option>Mandera</option><option>Marsabit</option><option>Meru</option><option>Migori</option><option>Mombasa</option><option>Murang'a</option><option>Nairobi</option><option>Nakuru</option><option>Nandi</option><option>Narok</option><option>Nyamira</option><option>Nyandarua</option><option>Nyeri</option><option>Samburu</option><option>Siaya</option><option>Taita-Taveta</option><option>Tana River</option><option>Tharaka-Nithi</option><option>Trans Nzoia</option><option>Turkana</option><option>Uasin Gishu</option><option>Vihiga</option><option>Wajir</option><option>West Pokot</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Education Level</label>
            <select id="education" class="premium-input">
              <option disabled selected>Select Level</option>
              <option>Primary</option><option>Secondary</option><option>Diploma</option><option>Degree</option><option>Masters</option><option>PhD</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Employment Type</label>
            <select id="employment" class="premium-input">
              <option disabled selected>Select Status</option>
              <option>Employed</option><option>Self-employed</option><option>Unemployed</option><option>Business</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Monthly Income (KSH)</label>
            <input type="number" id="income" placeholder="e.g. 25000" class="premium-input" />
          </div>
        </div>

        <!-- Referee -->
        <div class="pt-6 border-t border-white/10">
          <p class="text-sm font-bold text-red-500 uppercase tracking-widest mb-4">Emergency Contact (Referee)</p>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Referee Name</label>
              <input type="text" id="refereeName" placeholder="Full Name" class="premium-input" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Relation</label>
              <select id="refereeRelation" class="premium-input">
                <option disabled selected>Choose Relation</option>
                <option>Parent</option><option>Sibling</option><option>Friend</option><option>Spouse</option><option>Colleague</option>
              </select>
            </div>
          </div>
          <div class="mt-4">
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Referee Phone</label>
            <input type="tel" id="refereePhone" placeholder="07XXXXXXXX" class="premium-input" />
          </div>
        </div>

        <button onclick="saveOtherDetails()" class="btn-premium btn-accent-grad w-full py-4 text-lg mt-4 pulse-gold">
          Check Loan Limit <i class="fas fa-chart-line ml-2"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    async function saveOtherDetails() {
      const county = document.getElementById("county").value;
      const income = document.getElementById("income").value;

      if(!county || !income) {
        alert("Please complete the required information.");
        return;
      }

      document.getElementById("loader").classList.remove("hidden");

      try {
        const data = {
          county,
          education: document.getElementById("education").value,
          employment: document.getElementById("employment").value,
          income,
          refereeName: document.getElementById("refereeName").value.trim(),
          refereePhone: document.getElementById("refereePhone").value.trim(),
          refereeRelation: document.getElementById("refereeRelation").value,
          step: 'other_details',
          createdAt: new Date().toISOString()
        };

        localStorage.setItem("otherDetails", JSON.stringify(data));

        setTimeout(() => {
          window.location.href = "checklimit.html";
        }, 2000);
      } catch (error) {
        console.error("Error saving other details:", error);
        document.getElementById("loader").classList.add("hidden");
        alert("An error occurred. Please try again.");
      }
    }
  </script>
</body>

</html>
