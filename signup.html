<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Information | Hela Pesa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="main.css">
</head>

<body class="bg-mesh min-h-screen text-white font-sans py-12 px-6">

  <!-- Loader Overlay -->
  <div id="loader" class="hidden fixed inset-0 z-[100] bg-[#0f172a]/90 backdrop-blur-md flex flex-col items-center justify-center">
    <div class="relative w-20 h-20 mb-6">
      <div class="absolute inset-0 border-4 border-red-600 border-t-transparent rounded-full animate-spin"></div>
    </div>
    <div class="text-xl font-bold text-white uppercase animate-pulse">Saving Profile...</div>
  </div>

  <div class="max-w-xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-10">
      <a href="index.html">
        <img src="zashlogo.png" alt="Hela Pesa" class="w-16 h-16 mx-auto mb-4 rounded-full shadow-2xl border-2 border-red-600/30">
      </a>
      <h1 class="text-3xl font-extrabold mb-2 uppercase tracking-tight">Personal Information</h1>
      <p class="text-slate-400">Step 1 of 3: Building your financial profile</p>
    </div>

    <!-- Form Container -->
    <div class="glass-card p-8 lg:p-12">
      <div class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">First Name</label>
            <input type="text" id="firstName" placeholder="Enter First Name" class="premium-input" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Middle Name</label>
            <input type="text" id="middleName" placeholder="Optional" class="premium-input" />
          </div>
        </div>

        <div>
           <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Last Name</label>
           <input type="text" id="lastName" placeholder="Enter Last Name" class="premium-input" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Date of Birth</label>
            <input type="date" id="dob" class="premium-input" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">ID Number</label>
            <input type="number" id="idNumber" placeholder="National ID" class="premium-input" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Email Address</label>
          <input type="email" id="email" placeholder="example@gmail.com" class="premium-input" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Gender</label>
            <select id="gender" class="premium-input">
              <option value="" disabled selected>Select Gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Alt Phone</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm font-bold border-r border-slate-700 pr-3">+254</span>
              <input type="tel" id="altPhone" maxlength="9" placeholder="7XXXXXXXX" class="premium-input pl-20" />
            </div>
          </div>
        </div>

        <button onclick="saveSignupInfo()" class="btn-premium btn-primary-grad w-full py-4 text-lg mt-4">
          Next Step <i class="fas fa-chevron-right ml-2 text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Footer Info -->
    <div class="mt-12 text-center text-slate-500 text-xs">
      <p class="mb-4">All data is encrypted and protected under the Kenya Data Protection Act.</p>
      <div class="flex items-center justify-center gap-6">
        <span class="flex items-center gap-1"><i class="fas fa-lock text-red-500/50"></i> SSL SECURE</span>
        <span class="flex items-center gap-1"><i class="fas fa-shield-halved text-red-500/50"></i> ENCRYPTED</span>
      </div>
    </div>
  </div>

  <script>
    async function saveSignupInfo() {
      const btn = document.querySelector('button');
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();

      if(!firstName || !lastName || !email) {
        alert("Please fill in all required fields.");
        return;
      }

      document.getElementById("loader").classList.remove("hidden");

      try {
        const data = {
          firstName,
          middleName: document.getElementById("middleName").value.trim(),
          lastName,
          dob: document.getElementById("dob").value,
          idNumber: document.getElementById("idNumber").value.trim(),
          email,
          gender: document.getElementById("gender").value,
          altPhone: document.getElementById("altPhone").value.trim(),
          step: 'personal_info',
          createdAt: new Date().toISOString()
        };

        localStorage.setItem("signupData", JSON.stringify(data));
        
        // Add a slight delay for "premium" feel response
        setTimeout(() => {
          window.location.href = "otherdetails.html";
        }, 1200);
      } catch (error) {
        console.error("Error saving data:", error);
        document.getElementById("loader").classList.add("hidden");
        alert("Verification failed. Please check your inputs.");
      }
    }
  </script>
</body>

</html>
